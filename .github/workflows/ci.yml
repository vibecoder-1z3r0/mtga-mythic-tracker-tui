name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check formatting (black)
        run: black --check .

      - name: Lint (flake8)
        run: flake8 .

      - name: Run tests (pytest)
        run: pytest tests/test_models.py tests/test_config.py tests/test_state.py tests/test_parser.py tests/test_data.py tests/test_event_models.py -v

      - name: Run TUI snapshot tests
        run: pytest tests/test_snapshots.py -v

      - name: Upload snapshot failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-report
          path: snapshot_report.html
          if-no-files-found: ignore

  manual-tui-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies (manual/ is standalone)
        run: |
          cd manual
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests (pytest)
        run: |
          cd manual
          pytest test_event_models.py test_mwm_models.py -v
